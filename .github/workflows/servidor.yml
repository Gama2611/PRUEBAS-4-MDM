# Pruebas del servidor MDM sobre SQLite y sobre PostgreSQL real.
name: Servidor MDM

on:
  push:
    branches: [main, master]
    paths: ["server/**", ".github/workflows/servidor.yml"]
  pull_request:
    paths: ["server/**"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: adipack_mdm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r requirements.txt
      - name: Pruebas con SQLite
        run: python -m pytest -q
      - name: Pruebas con PostgreSQL
        env:
          MDM_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/adipack_mdm_test
        run: python -m pytest -q
