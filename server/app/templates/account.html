{% extends "base.html" %}{% from "_icons.html" import icon %}
{% block title %}Mi cuenta{% endblock %}
{% block heading %}Mi cuenta{% endblock %}
{% block sub %}Usuario {{ user }}{% endblock %}
{% block content %}
<div class="card" style="max-width:480px">
  <h2>Cambiar contraseña</h2>
  <form method="post" action="/account" class="mt">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="field"><label class="f">Contraseña actual</label><input type="password" name="current" required autocomplete="current-password"></div>
    <div class="field"><label class="f">Nueva contraseña</label><input type="password" name="new" required minlength="10" autocomplete="new-password"><div class="help">Mínimo 10 caracteres.</div></div>
    <div class="field"><label class="f">Repite la nueva contraseña</label><input type="password" name="confirm" required minlength="10" autocomplete="new-password"></div>
    <button class="btn">{{ icon('lock') }} Cambiar contraseña</button>
  </form>
</div>
{% endblock %}
